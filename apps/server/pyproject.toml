[project]
name = "check-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "httpx>=0.28", "python-chess>=1.999", "pydantic-settings>=2.8"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["check_server"]
[tool.pytest.ini_options]
pythonpath = ["."]
