name: publish-cli

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Semantic version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      release_channel:
        description: npm dist-tag and release stability
        type: choice
        required: true
        default: alpha
        options:
          - alpha
          - beta
          - production
permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify npm trusted publisher
        run: node scripts/check-npm-trusted-publisher.mjs
      - run: pnpm install --frozen-lockfile
      - name: Bump CLI version
        id: release
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          BASE_VERSION="$(git show "${GITHUB_SHA}:apps/cli/package.json" | node -e "console.log(JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version)")"
          VERSION="$(node scripts/bump-cli-version.mjs "$VERSION_BUMP" "$RELEASE_CHANNEL" "$BASE_VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$RELEASE_CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"
      - run: pnpm build --filter=@kennylwx/cli...
      - run: pnpm --filter @kennylwx/cli test
      - name: Stage and smoke-test the publishable package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node scripts/prepare-cli-package.mjs "$RUNNER_TEMP/chess-package"
          mkdir -p "$RUNNER_TEMP/chess-pack"
          npm pack --json --pack-destination "$RUNNER_TEMP/chess-pack" "$RUNNER_TEMP/chess-package"
          npm install --prefix "$RUNNER_TEMP/chess-cli-install" --no-audit --no-fund "$RUNNER_TEMP/chess-pack/kennylwx-cli-${VERSION}.tgz"
          node scripts/smoke-installed-cli.mjs "$RUNNER_TEMP/chess-cli-install/node_modules/.bin/chess"
      - name: Commit version on main
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! git diff --quiet -- apps/cli/package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/cli/package.json
            git commit -m "chore(cli): release v${VERSION}"
            git push origin HEAD:main
          fi
      - name: Create and push release tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "v${VERSION}")"
            if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
              echo "Tag v${VERSION} already points to a different commit." >&2
              exit 1
            fi
          else
            git tag "v${VERSION}"
          fi
          git push origin "v${VERSION}"
      - name: Publish to npm
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          npm --version
          if npm view "@kennylwx/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "@kennylwx/cli@${VERSION} is already published; continuing with the remaining release steps."
          else
            TAG="$RELEASE_CHANNEL"
            if [ "$RELEASE_CHANNEL" = production ]; then TAG=latest; fi
            npm publish "$RUNNER_TEMP/chess-package" --provenance --access public --tag "$TAG"
          fi
      - name: Prepare Homebrew formula
        if: steps.release.outputs.channel == 'production'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          TARBALL="$(npm view "@kennylwx/cli@${VERSION}" dist.tarball)"
          curl --fail --location "$TARBALL" --output "$RUNNER_TEMP/chess-cli.tgz"
          SHA256="$(shasum -a 256 "$RUNNER_TEMP/chess-cli.tgz" | cut -d ' ' -f 1)"
          node scripts/generate-homebrew-formula.mjs "$VERSION" "$TARBALL" "$SHA256" "$RUNNER_TEMP/chess-cli.rb"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            if [ "$RELEASE_CHANNEL" = production ]; then
              gh release upload "v${VERSION}" "$RUNNER_TEMP/chess-cli.rb" --clobber
            fi
            echo "GitHub release v${VERSION} already exists."
          elif [ "$RELEASE_CHANNEL" = production ]; then
            gh release create "v${VERSION}" "$RUNNER_TEMP/chess-cli.rb" --title "Chess CLI v${VERSION}" --generate-notes
          else
            gh release create "v${VERSION}" --title "Chess CLI v${VERSION} (${RELEASE_CHANNEL})" --generate-notes --prerelease
          fi
