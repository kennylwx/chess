name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: astral-sh/setup-uv@v6
        with: { version: 0.7.22, enable-cache: true }
      - run: pnpm install --frozen-lockfile=false
      - run: uv sync --all-packages --all-groups
      - run: pnpm typecheck
      - run: uv run --package check-server pytest -q
      - run: pnpm --filter @check/web exec playwright install --with-deps chromium
      - run: pnpm --filter @check/web test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshot-and-report
          path: |
            apps/web/screenshots
            apps/web/test-results
            apps/web/playwright-report
