name: quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v6
        with: { version: 0.7.22, enable-cache: true }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm typecheck
      - run: pnpm build --filter=zchess...
      - name: Check concurrent chess tests and CLI imports
        run: node scripts/check-concurrent-cli-imports.mjs
      - name: Install and smoke-test the packed CLI
        run: |
          mkdir -p "$RUNNER_TEMP/zchess-pack"
          node scripts/prepare-cli-package.mjs "$RUNNER_TEMP/zchess-package"
          npm pack --json --pack-destination "$RUNNER_TEMP/zchess-pack" "$RUNNER_TEMP/zchess-package"
          VERSION="$(node -p "require('./apps/cli/package.json').version")"
          npm install --prefix "$RUNNER_TEMP/zchess-cli-install" --no-audit --no-fund "$RUNNER_TEMP/zchess-pack/zchess-${VERSION}.tgz"
          node scripts/smoke-installed-cli.mjs "$RUNNER_TEMP/zchess-cli-install/node_modules/.bin/chess"
          python3 scripts/smoke-cli-terminal.py "$RUNNER_TEMP/zchess-cli-install/node_modules/.bin/chess"
          node scripts/generate-homebrew-formula.mjs 0.0.0 https://registry.npmjs.org/zchess/-/zchess-0.0.0.tgz "$(printf '0%.0s' {1..64})" "$RUNNER_TEMP/zchess.rb"
          ruby -c "$RUNNER_TEMP/zchess.rb"
      - run: pnpm --filter @zchess/web exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshot-and-report
          path: |
            apps/web/screenshots
            apps/web/test-results
            apps/web/playwright-report
